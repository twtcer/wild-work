name: Docker Image

# 发版 tag（v*）构建 linux/amd64 + arm64 镜像推 GHCR；也可手动触发（dev 标签）。
# 与 build.yml（五平台二进制 release）相互独立：本工作流失败不阻塞二进制发版。
#
# **阿里云 ACR（可选，fork 新增）**：配置以下 secrets 后自动同时推 ACR，未配置则
# 整段跳过、不影响 GHCR：ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD（必需）、
# ACR_REPOSITORY（可选，如 landwind/wild-work，默认即此值）。
# ⚠️ ACR 不认 BuildKit 默认的 provenance/SBOM attestation 清单（oci.empty.v1+json），
# 推送会报 `unknown manifest class` —— 故 ACR 那条构建必须 --provenance=false --sbom=false，
# 与 scripts/docker-build-push.sh 的本地脚本同口径。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 的运行阶段（apk add）在 QEMU 模拟下执行；构建阶段由 Dockerfile 的
      # --platform=$BUILDPLATFORM + GOARCH 交叉编译，不吃模拟开销。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求镜像名全小写（仓库 owner 可能含大写），bash 4 的 ,,, 一刀搞定
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # tag 触发 → v1.2.3 / 1.2 / latest（semver 类型只在 tag ref 上生效）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 手动触发（非 tag）→ dev；tag 触发 → latest
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dev,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 阿里云 ACR（可选）----
      # 未配 secrets 时 enabled=false，后续两步整体跳过（GHCR 已推完，不受影响）。
      - name: Check ACR secrets
        id: acr
        run: |
          if [ -n "${{ secrets.ACR_REGISTRY }}" ] && [ -n "${{ secrets.ACR_USERNAME }}" ] && [ -n "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ACR_REGISTRY/ACR_USERNAME/ACR_PASSWORD，跳过阿里云 ACR 推送"
          fi

      - uses: docker/login-action@v3
        if: steps.acr.outputs.enabled == 'true'
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 额外一次构建推 ACR：registry 不同不能复用上面的 tags，但可复用同一份 gha
      # 缓存 ⇒ 只是多一次 manifest 导出，几乎不耗时。
      # --provenance=false --sbom=false 是 ACR 硬要求（见文件头注释）。
      - uses: docker/build-push-action@v6
        if: steps.acr.outputs.enabled == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_REPOSITORY || 'landwind/wild-work' }}:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_REPOSITORY || 'landwind/wild-work' }}:latest
          cache-from: type=gha

      - name: ACR pushed
        if: steps.acr.outputs.enabled == 'true'
        run: echo "✅ 已推送 ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_REPOSITORY || 'landwind/wild-work' }}"
