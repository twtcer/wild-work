# wild-work Docker Compose
#
# 首次使用：
#   1. cp .env.example .env，改掉 WILDWORK_ADMIN_PASSWORD（非环回监听强制要求，R4）
#      .env 里已带全套桌面形态默认参数（internal/config.Default()），按需外部覆盖；
#      不写某一行 = 不注入该环境变量 = 走 wildwork-data/config.json / 代码默认
#   2. docker compose up -d --build
#   3. 浏览器打开 http://127.0.0.1:7863/ → 面板登录 → 管理账号
#
# 容器内添加账号的限制见 README「Docker」小节：TraeWork / 千问办公的浏览器登录
# 已可用（回调端口 43903 已在下面发布）、WorkBuddy/Qoder 系列为上游轮询式登录；
# GLM（需 CDP + 真浏览器）、小浣熊浏览器授权、导入型渠道在容器内不可用。
services:
  wild-work:
    build:
      context: .
      args:
        # 模块代理：默认官方源；大陆网络一条命令覆盖（不改文件）：
        #   GOPROXY=https://goproxy.cn,direct docker compose up -d --build
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    image: registry.cn-guangzhou.aliyuncs.com/landwind/wild-work:latest
    container_name: wild-work
    restart: unless-stopped
    ports:
      # 宿主机端口冲突时改左侧，如 "8080:7863"（容器内监听端口不变则健康检查无需动）
      - "7863:7863"
      # OAuth 本机回调（traework / qwenwork 添加账号时用）。
      # redirect_uri 仍写 http://127.0.0.1:43903/...，所以必须让宿主 127.0.0.1:43903
      # 转发进容器 —— 否则浏览器拿到 code 后 connection refused（登录超时）。
      # 只绑宿主环回：本机浏览器够用，且不把回调端口暴露给局域网。
      # 从别的机器打开面板时：改 "43903:43903" 并设 WILDWORK_CALLBACK_HOST=<面板机器IP>。
      - "127.0.0.1:43903:43903"
    environment:
      # ──────────── 容器固定项（与桌面默认不同，改了要同步 ports / healthcheck） ────────────
      TZ: Asia/Shanghai # 镜像已默认；签到时刻按此时区计算
      # 本机 OAuth 回调监听：容器内必须绑 0.0.0.0（127.0.0.1 只在容器命名空间内），
      # 端口固定才能被上面的端口映射转发命中。桌面形态默认是 127.0.0.1:0（随机端口）。
      WILDWORK_CALLBACK_LISTEN: "0.0.0.0:43903"
      # 容器内必须对外监听：127.0.0.1 指向容器自己，端口映射会不可达。
      # 一旦对外监听，管理密码即为强制（启动层双重把关，见 R4）。
      WILDWORK_LISTEN: "0.0.0.0:7863"

      # ──────────── 必填 ────────────
      # ${VAR:?提示} 形式：未设置时 compose 直接报错，不会起一个起不来的容器
      WILDWORK_ADMIN_PASSWORD: "${WILDWORK_ADMIN_PASSWORD:?未设置管理密码——请先 cp .env.example .env 并改掉 WILDWORK_ADMIN_PASSWORD}"

      # ──────────── 桌面形态默认参数的外部透传（值来自 .env，见 .env.example） ────────────
      # 优先级：环境变量 > wildwork-data/config.json > 代码默认 internal/config.Default()。
      # 写法 ${VAR:-}：.env 不写这一行就注入空值 → applyEnv 跳过空值 → 不盖掉 config.json
      #（面板里改这几项仍然生效）；写了就以 .env 为准（这正是「外部配置」的目的）。
      #
      # OpenAI 接口 Key——唯一带兜底默认值的一项（不写也注入下面这个 Key）：
      WILDWORK_API_KEY: "${WILDWORK_API_KEY:-sk-8b2c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a}"
      # 数据落点（相对路径基于容器内 WILDWORK_HOME=/data）：默认 ./auths、./data/state.json
      WILDWORK_AUTH_DIR: "${WILDWORK_AUTH_DIR:-}"
      WILDWORK_STATE_FILE: "${WILDWORK_STATE_FILE:-}"
      # 区域：cn | global（默认 cn）
      WILDWORK_REGION: "${WILDWORK_REGION:-}"
      # 账号错误惩罚：硬冷却 12h / 限流软冷却 60s / 连续错误 3 次 / 错误冷却 10m
      WILDWORK_HARD_CREDIT: "${WILDWORK_HARD_CREDIT:-}"
      WILDWORK_SOFT_RATE: "${WILDWORK_SOFT_RATE:-}"
      WILDWORK_ERR_THRESHOLD: "${WILDWORK_ERR_THRESHOLD:-}"
      WILDWORK_ERR_COOLDOWN: "${WILDWORK_ERR_COOLDOWN:-}"
      # 上游请求超时（秒，非流式；流式不设超时，见 R35）：默认 120
      WILDWORK_TIMEOUT_SECONDS: "${WILDWORK_TIMEOUT_SECONDS:-}"
      # OAuth 回调写进 redirect_uri 的主机（监听固定 0.0.0.0:43903）：默认 127.0.0.1，
      # 从别的机器打开面板登录 traework/qwenwork 时改成面板机器 IP
      WILDWORK_CALLBACK_HOST: "${WILDWORK_CALLBACK_HOST:-}"
      # 三接口兼容层（面板「模型路由」同源）：默认渠道 workbuddy / max_tokens 封顶 32000
      WILDWORK_DEFAULT_CHANNEL: "${WILDWORK_DEFAULT_CHANNEL:-}"
      WILDWORK_MAX_TOKENS_CAP: "${WILDWORK_MAX_TOKENS_CAP:-}"
      # 无环境变量、只能改面板或挂载的 config.json 的参数（签到时间、临期阈值、
      # 单渠道代理、模型映射表、开机自启），见 .env 末尾说明。
    volumes:
      # 数据根（WILDWORK_HOME）：./wildwork-data/{config.json, auths/, data/}，
      # 与便携版安装目录布局一致，可整体拷贝迁移。
      # 首次创建的目录属主为 root，镜像以 uid 1000 运行——Linux 主机请先：
      #   mkdir -p wildwork-data && sudo chown 1000:1000 wildwork-data
      # （Docker Desktop / macOS / Windows 自动映射，无需处理）
      - ./wildwork-data:/data
